<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MouseBattery for Windows</title>
  <desc id="desc">A stylized Windows taskbar shows a green tray icon with 90 percent and a compact MouseBattery menu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1220"/>
      <stop offset="0.52" stop-color="#111d31"/>
      <stop offset="1" stop-color="#0a2b25"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62e6a5"/>
      <stop offset="1" stop-color="#21a96b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="195" cy="90" r="120" fill="#31c982" opacity=".10" filter="url(#soft)"/>
  <circle cx="1030" cy="320" r="150" fill="#3b82f6" opacity=".10" filter="url(#soft)"/>

  <g transform="translate(78 86)">
    <rect x="0" y="0" width="92" height="92" rx="22" fill="url(#glow)" filter="url(#shadow)"/>
    <text x="46" y="61" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="45" font-weight="700" fill="#fff">90</text>
    <text x="0" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#f5f8ff">MouseBattery</text>
    <text x="0" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9eabc0">Your mouse battery. One glance. Zero clutter.</text>
    <g transform="translate(0 226)" font-family="Segoe UI, Arial, sans-serif" font-size="18">
      <rect width="126" height="38" rx="19" fill="#ffffff" opacity=".08"/>
      <text x="63" y="25" text-anchor="middle" fill="#dce6f5">42 KiB</text>
      <rect x="138" width="172" height="38" rx="19" fill="#ffffff" opacity=".08"/>
      <text x="224" y="25" text-anchor="middle" fill="#dce6f5">Native Win32</text>
      <rect x="322" width="170" height="38" rx="19" fill="#ffffff" opacity=".08"/>
      <text x="407" y="25" text-anchor="middle" fill="#dce6f5">0% idle CPU</text>
    </g>
  </g>

  <g transform="translate(730 54)" filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="390" height="282" rx="18" fill="#1e2530" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="20" y="20" width="350" height="62" rx="13" fill="#2a3442"/>
    <rect x="34" y="32" width="38" height="38" rx="9" fill="url(#glow)"/>
    <text x="53" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">90</text>
    <text x="88" y="48" font-size="16" font-weight="600" fill="#f5f8ff">Logitech G305 SE</text>
    <text x="88" y="69" font-size="13" fill="#aab6c8">Battery level: 90%</text>

    <line x1="20" y1="102" x2="370" y2="102" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="34" y="137" font-size="16" fill="#e9eef7">Refresh now</text>
    <text x="342" y="137" text-anchor="end" font-size="15" fill="#65dfa4">↻</text>
    <text x="34" y="182" font-size="16" fill="#e9eef7">Start with Windows</text>
    <rect x="314" y="161" width="44" height="24" rx="12" fill="#3d4a5c"/>
    <circle cx="326" cy="173" r="8" fill="#b6c0cf"/>
    <line x1="20" y1="210" x2="370" y2="210" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="34" y="248" font-size="16" fill="#e9eef7">Exit</text>
  </g>

  <g>
    <path d="M0 370H1200V402Q1200 430 1172 430H28Q0 430 0 402Z" fill="#151b24"/>
    <circle cx="1040" cy="400" r="4" fill="#7f8a99"/>
    <path d="M1060 396l7 7 7-7" fill="none" stroke="#aab3c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1087" y="383" width="34" height="34" rx="8" fill="url(#glow)"/>
    <text x="1104" y="406" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">90</text>
    <text x="1140" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#dce3ed">ENG</text>
  </g>
</svg>
