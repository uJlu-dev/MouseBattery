name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build release executable
        shell: pwsh
        run: ./build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseBattery-windows-x64
          path: dist/MouseBattery.exe

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME dist/MouseBattery.exe
          --verify-tag
          --generate-notes
          --title "MouseBattery $env:GITHUB_REF_NAME"
